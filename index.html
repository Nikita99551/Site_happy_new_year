<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Год козы — лови призы · Новогодняя акция Аникс 2027</title>
    <meta name="description" content="Покупайте в Аникс с 16 ноября 2026 по 10 января 2027, регистрируйте чеки и проходите новогодний маршрут из 30 шагов. Сертификаты Аникс и билеты на розыгрыши призов, главный — путешествие на Алтай." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#173f2a" />
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/PlayfairDisplay-900-normal-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Manrope-500-normal-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Загрузочный экран. Стили здесь, а не в SCSS: экран должен появиться раньше, чем загрузится код сайта.
      Та же разметка — в src/shared/ui/page-loader/PageLoader.tsx (пока грузится страница).
      Лампочки зажигаются по одной, как шаги маршрута. Экран виден, только если загрузка дольше 0,25 с.
    -->
    <style>
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 28px; padding: 24px;
        background: radial-gradient(120% 90% at 50% 40%, #1d4d34 0%, #173f2a 55%, #0f2d1e 100%); color: #fff8e8; text-align: center;
        font-family: Manrope, 'Segoe UI', Arial, sans-serif; animation: boot-in 300ms ease-out 250ms both; }
      .boot-shown .boot { animation: none; }
      .boot__logo { display: grid; place-items: center; padding: 18px 30px; background: #fff8e8; border-radius: 18px; box-shadow: 0 14px 30px rgba(5, 20, 12, 0.35); }
      .boot__logo img { display: block; width: 156px; height: auto; }
      .boot__garland { width: min(300px, 80vw); height: auto; overflow: visible; }
      .boot__bulb ellipse { fill: rgba(255, 248, 232, 0.16); stroke: rgba(255, 248, 232, 0.25); stroke-width: 1; animation: boot-bulb 2.1s ease-in-out infinite; animation-delay: calc(var(--i) * 0.22s); }
      .boot__text { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.01em; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-bulb {
        0%, 100% { fill: rgba(255, 248, 232, 0.16); filter: none; }
        12%, 62% { fill: #e2b24a; stroke: #f3d27e; filter: drop-shadow(0 0 7px rgba(226, 178, 74, 0.9)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot { animation-duration: 1ms; }
        .boot__bulb ellipse { animation: none; fill: #e2b24a; stroke: #f3d27e; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot__logo"><img src="/img/logo.svg" alt="Аникс" width="156" height="41" /></div>
        <svg class="boot__garland" viewBox="0 0 280 72" aria-hidden="true">
          <path d="M4 10 C 50 46, 92 46, 140 18 C 188 46, 230 46, 276 10" fill="none" stroke="#0f2d1e" stroke-width="3" stroke-linecap="round" />
          <g class="boot__bulb" style="--i:0" transform="translate(24 24)"><rect x="-4" y="0" width="8" height="7" rx="2" fill="#0f2d1e" /><ellipse cx="0" cy="17" rx="8" ry="11" /></g>
          <g class="boot__bulb" style="--i:1" transform="translate(62 35)"><rect x="-4" y="0" width="8" height="7" rx="2" fill="#0f2d1e" /><ellipse cx="0" cy="17" rx="8" ry="11" /></g>
          <g class="boot__bulb" style="--i:2" transform="translate(101 34)"><rect x="-4" y="0" width="8" height="7" rx="2" fill="#0f2d1e" /><ellipse cx="0" cy="17" rx="8" ry="11" /></g>
          <g class="boot__bulb" style="--i:3" transform="translate(140 18)"><rect x="-4" y="0" width="8" height="7" rx="2" fill="#0f2d1e" /><ellipse cx="0" cy="17" rx="8" ry="11" /></g>
          <g class="boot__bulb" style="--i:4" transform="translate(179 34)"><rect x="-4" y="0" width="8" height="7" rx="2" fill="#0f2d1e" /><ellipse cx="0" cy="17" rx="8" ry="11" /></g>
          <g class="boot__bulb" style="--i:5" transform="translate(218 35)"><rect x="-4" y="0" width="8" height="7" rx="2" fill="#0f2d1e" /><ellipse cx="0" cy="17" rx="8" ry="11" /></g>
          <g class="boot__bulb" style="--i:6" transform="translate(256 24)"><rect x="-4" y="0" width="8" height="7" rx="2" fill="#0f2d1e" /><ellipse cx="0" cy="17" rx="8" ry="11" /></g>
        </svg>
        <p class="boot__text">Зажигаем гирлянду…</p>
      </div>
      <noscript><style>.boot { display: none; }</style><p style="padding: 24px; font: 18px Arial, sans-serif; color: #fff8e8; background: #173f2a">Для работы сайта включите JavaScript в настройках браузера.</p></noscript>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
